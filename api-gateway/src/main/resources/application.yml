
server:
  port: 8086

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/user/**

            - id:  auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: patient-service
              uri: lb://PATIENT-SERVICE
              predicates:
                - Path=/api/patients/**

            - id: DOCTOR-SERVICE
              uri: lb://DOCTOR-SERVICE
              predicates:
                - Path=/api/doctors/**

            - id: APPOINTMENT-SERVICE
              uri: lb://APPOINTMENT-SERVICE
              predicates:
                - Path=/api/appointments/**

            - id: BILLING-SERVICE
              uri: lb://BILLING-SERVICE
              predicates:
                - Path=/api/billing/**

            - id: PHARMACY-SERVICE
              uri: lb://PHARMACY-SERVICE
              predicates:
                - Path=/api/pharmacy/**



eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/


management:
  endpoints:
    web:
      exposure:
        include: "*"
